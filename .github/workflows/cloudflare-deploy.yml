name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Cloudflare target environment"
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}

jobs:
  validate:
    name: Validate monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  provision:
    name: Provision Cloudflare infra
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Provision DNS, Pages, D1, Queues, R2, KV
        run: node tooling/cloudflare/provision-infra.mjs --environment "$DEPLOY_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ROOT_DOMAIN: ${{ vars.CLOUDFLARE_ROOT_DOMAIN }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          CLOUDFLARE_API_SUBDOMAIN: ${{ vars.CLOUDFLARE_API_SUBDOMAIN }}
          CLOUDFLARE_R2_LOCATION: ${{ vars.CLOUDFLARE_R2_LOCATION }}
          CF_D1_DATABASES: ${{ vars.CF_D1_DATABASES }}
          CF_QUEUES: ${{ vars.CF_QUEUES }}
          CF_R2_BUCKETS: ${{ vars.CF_R2_BUCKETS }}
          CF_KV_NAMESPACES: ${{ vars.CF_KV_NAMESPACES }}

  deploy-api:
    name: Deploy API worker
    runs-on: ubuntu-latest
    needs: provision
    timeout-minutes: 25
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy API worker to Cloudflare Workers
        run: node tooling/cloudflare/deploy-api-worker.mjs --environment "$DEPLOY_ENV" --branch "${{ github.ref_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ROOT_DOMAIN: ${{ vars.CLOUDFLARE_ROOT_DOMAIN }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          CLOUDFLARE_API_SUBDOMAIN: ${{ vars.CLOUDFLARE_API_SUBDOMAIN }}

  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: provision
    timeout-minutes: 35
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        app:
          - web-landing
          - web-console
          - web-resident
          - web-command
          - web-listings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy application to Cloudflare Pages
        run: node tooling/cloudflare/deploy-pages-app.mjs --app "${{ matrix.app }}" --environment "$DEPLOY_ENV" --branch "${{ github.ref_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
